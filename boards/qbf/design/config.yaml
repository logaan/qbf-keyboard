meta:
  engine: 4.2.1
  version: 0.0.2
  author: Logan Campbell

units:
  column_pitch: 19.05
  cap_height: 26.5
  row_pitch: 27.5
  fifth_x: 87.1
  fifth_offset: 18.75
  midline_y: 48
  cap_margin: 2.25
  board_left: 0.4
  board_right: 98.1
  board_bottom: 18.75
  board_top: 77.25
  board_width: board_right - board_left
  board_height: board_top - board_bottom
  controller_x: 87.5
  controller_y: midline_y - 0.5
  power_x: 3.75
  battery_x: 35.5
  battery_well_length: 58.1
  battery_well_width: 11.1

points:
  zones:
    pad:
      anchor:
        shift: [10.9, 34.25]
      key:
        padding: row_pitch
      columns:
        c0:
          rows:
            bottom: {net: D5, label: b1}
            top: {net: D0, label: t1}
        c1:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D6, label: b2}
            top: {net: D1, label: t2}
        c2:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D7, label: b3}
            top: {net: D2, label: t3}
        c3:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D8, label: b4}
            top: {net: D3, label: t4}
      rows:
        bottom:
        top:
    extra:
      anchor:
        shift: [fifth_x, midline_y - fifth_offset]
      key:
        padding: 2 * fifth_offset
      columns:
        c4:
          rows:
            bottom: {net: D9, label: b5}
            top: {net: D4, label: t5}
      rows:
        bottom:
        top:

outlines:
  board:
    - what: rectangle
      where:
        shift: [(board_left + board_right) / 2, (board_bottom + board_top) / 2]
      size: [board_width, board_height]
      corner: 1.5
    - what: rectangle
      operation: subtract
      where:
        shift: [(76.5 + board_right + 0.5) / 2, controller_y]
      size: [board_right + 0.5 - 76.5, 18.2]
      corner: 0.5

pcbs:
  macropad:
    outlines:
      main:
        outline: board
    footprints:
      top_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_top$/
        adjust:
          rotate: 90
        params:
          from: GND
          to: '{{net}}'
          label: '{{label}}'
          cap_length: 26.5
          label_offset: 0
      bottom_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_bottom$/
        adjust:
          rotate: 90
        params:
          from: '{{net}}'
          to: GND
          label: '{{label}}'
          cap_length: 26.5
          label_offset: 0
      extra_top_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_top
        params:
          from: GND
          to: '{{net}}'
          label: '{{label}}'
          cap_length: 17.5
          label_offset: 0
      extra_bottom_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_bottom
        params:
          from: '{{net}}'
          to: GND
          label: '{{label}}'
          cap_length: 17.5
          label_offset: 0
      controller:
        what: xiao_nrf52840_plus
        where:
          shift: [controller_x, controller_y]
      upper_left_mount:
        what: m2_mount
        where:
          shift: [20.425, 72.5]
      upper_right_mount:
        what: m2_mount
        where:
          shift: [58.525, 72.5]
      lower_left_mount:
        what: m2_mount
        where:
          shift: [20.425, 23.5]
      lower_right_mount:
        what: m2_mount
        where:
          shift: [58.525, 23.5]
      battery_connector:
        what: battery_sh
        where:
          shift: [71.375, midline_y]
        adjust:
          rotate: -90
      battery_wire:
        what: battery_wire
        where:
          shift: [75.2, 37.7]
      power_switch:
        what: power_pcm12
        where:
          shift: [power_x, midline_y]
        adjust:
          rotate: -90
      battery_space:
        what: battery_space
        where:
          shift: [battery_x, midline_y]
        params:
          length: 57.5
          width: 10.5
          thickness: 3.5
          capacity: 220
          model: 301055
          bottom_z: -1.4
      battery_well:
        what: battery_well
        where:
          shift: [battery_x, midline_y]
        params:
          length: battery_well_length
          width: battery_well_width
