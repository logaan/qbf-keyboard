meta:
  engine: 4.2.1
  version: 0.0.1
  author: Logan Campbell

units:
  column_pitch: 19.05
  cap_height: 26.5
  row_gap: 1
  row_pitch: cap_height + row_gap
  controller_x: 4 * column_pitch
  controller_y: row_pitch / 2
  controller_height: 17.8
  extra_cap_height: 17.5
  extra_offset: row_pitch / 2 + (cap_height - extra_cap_height) / 2
  display_width: 25.5
  display_height: 18
  display_x: 3 * column_pitch + 8.25 + 0.5 + display_width / 2
  board_width: display_x + display_width / 2 + 0.5 + 8.75
  board_height: row_pitch + cap_height + 1

points:
  zones:
    pad:
      key:
        padding: row_pitch
      columns:
        c0:
          rows:
            bottom: {net: D7}
            top: {net: D6}
        c1:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D8}
            top: {net: D5}
        c2:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D9}
            top: {net: D4}
        c3:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D10}
            top: {net: D3}
      rows:
        bottom:
        top:
    extra:
      key:
        padding: 2 * extra_offset
      anchor:
        ref: pad_c0_bottom
        shift: [controller_x, controller_y - extra_offset]
      columns:
        c4:
          rows:
            bottom: {net: D1}
            top: {net: D0}
      rows:
        bottom:
        top:

outlines:
  board:
    - what: rectangle
      where:
        ref: pad_c0_bottom
        shift: [board_width / 2 - 8.75, controller_y]
      size: [board_width, board_height]
      corner: 1.5
  display_adapter:
    - what: rectangle
      where:
        ref: pad_c0_bottom
        shift: [0, 0]
      size: [display_width, display_height]
      corner: 0.5

pcbs:
  macropad:
    outlines:
      main:
        outline: board
    footprints:
      top_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_top$/
        adjust:
          rotate: 90
        params:
          from: GND
          to: '{{net}}'
          label: '{{net}}'
          label_offset: 11
      bottom_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_bottom$/
        adjust:
          rotate: 90
        params:
          from: '{{net}}'
          to: GND
          label: '{{net}}'
          label_offset: -11
      extra_top_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_top
        adjust:
          rotate: 90
        params:
          from: GND
          to: '{{net}}'
          label: '{{net}}'
          label_offset: 7
          cap_length: extra_cap_height
      extra_bottom_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_bottom
        adjust:
          rotate: 90
        params:
          from: '{{net}}'
          to: GND
          label: '{{net}}'
          label_offset: -7
          cap_length: extra_cap_height
      controller:
        what: xiao_nrf52840
        where:
          ref: pad_c0_bottom
          shift: [controller_x, controller_y]
        adjust:
          rotate: -90
        params:
          D0: D0
          D1: D1
          D3: D3
          D4: D4
          D5: D5
          D6: D6
          D7: D7
          D8: D8
          D9: D9
          D10: D10
          GND: GND
          3V3: 3V3
      display:
        what: display_stack
        where:
          ref: pad_c0_bottom
          shift: [display_x, controller_y]
      display_wires:
        what: display_wires
        where:
          ref: pad_c0_bottom
          shift: [79, controller_y + 4.445]
      upper_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [column_pitch / 2, row_pitch]
      upper_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [2.5 * column_pitch, row_pitch]
      lower_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [column_pitch / 2, 0]
      lower_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [2.5 * column_pitch, 0]
  display:
    outlines:
      main:
        outline: display_adapter
    footprints:
      module:
        what: display_stack
        where:
          ref: pad_c0_bottom
        params:
          adapter: true
