meta:
  engine: 4.2.1
  version: 0.0.1
  author: Logan Campbell

units:
  column_pitch: 19.05
  row_pitch: 34

points:
  zones:
    pad:
      key:
        padding: row_pitch
      columns:
        c0:
          rows:
            bottom: {net: D7}
            top: {net: D6}
        c1:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D8}
            top: {net: D5}
        c2:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D9}
            top: {net: D4}
        c3:
          key: {spread: column_pitch}
          rows:
            bottom: {net: D10}
            top: {net: D3}
      rows:
        bottom:
        top:

outlines:
  board:
    - what: rectangle
      where:
        ref: pad_c0_bottom
        shift: [28.575, 17]
      size: [73.65, 60.5]
      corner: 1.5

pcbs:
  macropad:
    outlines:
      main:
        outline: board
    footprints:
      top_switches:
        what: choc_v1_15u_portrait
        where: /_top$/
        adjust:
          rotate: 90
        params:
          from: GND
          to: '{{net}}'
          label: '{{net}}'
          label_offset: 14.5
      bottom_switches:
        what: choc_v1_15u_portrait
        where: /_bottom$/
        adjust:
          rotate: 90
        params:
          from: '{{net}}'
          to: GND
          label: '{{net}}'
          label_offset: -14.5
      controller:
        what: xiao_nrf52840
        where:
          ref: pad_c0_bottom
          shift: [55, 17]
        adjust:
          rotate: -90
        params:
          D3: D3
          D4: D4
          D5: D5
          D6: D6
          D7: D7
          D8: D8
          D9: D9
          D10: D10
          GND: GND
      upper_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [-4.75, 44.5]
      upper_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [61.9, 44.5]
      lower_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [-4.75, -10.5]
      lower_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [61.9, -10.5]
