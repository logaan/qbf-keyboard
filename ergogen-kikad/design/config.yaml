meta:
  engine: 4.2.1
  version: 0.0.1
  author: Logan Campbell

units:
  column_pitch: 19.05
  cap_height: 26.5
  row_gap: 1
  row_pitch: cap_height + row_gap
  extra_x: 4 * column_pitch + (26.5 - 16.5) / 2
  controller_y: row_pitch / 2
  controller_height: 18.3
  extra_cap_height: 16.5
  extra_offset: row_pitch / 2 + (cap_height - extra_cap_height) / 2
  display_width: 36
  display_height: 14
  display_x: 3 * column_pitch + 8.25 + 0.5 + display_width / 2
  controller_x: display_x + 3.1
  right_mount_x: 3 * column_pitch + 8.25 + (column_pitch - 16.5) / 2
  board_width: controller_x + 18 + 0.5 + 8.75
  board_height: row_pitch + cap_height + 1
  controls_x: (extra_x + 26.5 / 2 + board_width - 8.75) / 2

points:
  zones:
    pad:
      key:
        padding: row_pitch
      columns:
        c0:
          rows:
            bottom: {net: P9, label: b1}
            top: {net: P4, label: t1}
        c1:
          key: {spread: column_pitch}
          rows:
            bottom: {net: P10, label: b2}
            top: {net: P5, label: t2}
        c2:
          key: {spread: column_pitch}
          rows:
            bottom: {net: P16, label: b3}
            top: {net: P6, label: t3}
        c3:
          key: {spread: column_pitch}
          rows:
            bottom: {net: P14, label: b4}
            top: {net: P7, label: t4}
      rows:
        bottom:
        top:
    extra:
      key:
        padding: 2 * extra_offset
      anchor:
        ref: pad_c0_bottom
        shift: [extra_x, controller_y - extra_offset]
      columns:
        c4:
          rows:
            bottom: {net: P15, label: b5}
            top: {net: P8, label: t5}
      rows:
        bottom:
        top:

outlines:
  board:
    - what: rectangle
      where:
        ref: pad_c0_bottom
        shift: [board_width / 2 - 8.75, controller_y]
      size: [board_width, board_height]
      corner: 1.5

pcbs:
  macropad:
    outlines:
      main:
        outline: board
    footprints:
      top_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_top$/
        adjust:
          rotate: 90
        params:
          from: GND
          to: '{{net}}'
          label: '{{label}}'
          label_offset: 11
      bottom_switches:
        what: choc_v1_15u_portrait
        where: /^pad_.*_bottom$/
        adjust:
          rotate: 90
        params:
          from: '{{net}}'
          to: GND
          label: '{{label}}'
          label_offset: -11
      extra_top_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_top
        adjust:
          rotate: 0
        params:
          from: GND
          to: '{{net}}'
          label: '{{label}}'
          label_offset: 8
      extra_bottom_switch:
        what: choc_v1_15u_portrait
        where: extra_c4_bottom
        adjust:
          rotate: 0
        params:
          from: '{{net}}'
          to: GND
          label: '{{label}}'
          label_offset: -11
      controller:
        what: nice_nano
        where:
          ref: pad_c0_bottom
          shift: [controller_x, controller_y]
        adjust:
          rotate: -90
        params:
          P1: LCD_CS
          P2: LCD_SI
          P3: LCD_CLK
          VCC: 3V3
          RAW: VBAT
          RST: RST
      display:
        what: nice_view
        where:
          ref: pad_c0_bottom
          shift: [display_x, controller_y]
      upper_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [column_pitch / 2, row_pitch]
      upper_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [2.5 * column_pitch, row_pitch]
      lower_left_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [column_pitch / 2, 0]
      lower_right_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [2.5 * column_pitch, 0]
      upper_outer_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [right_mount_x, row_pitch]
      lower_outer_mount:
        what: m2_mount
        where:
          ref: pad_c0_bottom
          shift: [right_mount_x, 0]
      battery_connector:
        what: battery_ph
        where:
          ref: pad_c0_bottom
          shift: [63.65, controller_y]
        adjust:
          rotate: -90
      power_switch:
        what: power_slide
        where:
          ref: extra_c4_bottom
          shift: [controls_x - extra_x, 0]
        adjust:
          rotate: 90
      reset_switch:
        what: reset_tact
        where:
          ref: extra_c4_top
          shift: [controls_x - extra_x, 0]
        adjust:
          rotate: 90
      battery_space:
        what: battery_space
        where:
          ref: pad_c0_bottom
          shift: [20.9, controller_y]
