<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2500" viewBox="0 0 1600 2500" role="img" aria-labelledby="title description">
<title id="title">Switch rotation: source edit to published keyboard files</title>
<desc id="description">Edit the switch rotation in ergogen/config.yaml, build with npm, prepare KiCad, reroute, regenerate previews, check, and publish the new files and ZIP on the Raspberry Pi. Includes a verified example changing only the top switch in column one.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#71829a"/></marker></defs>
<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172c43}.title{font-size:38px;font-weight:700}.subtitle{font-size:19px;fill:#54657b}.heading{font-size:25px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#526278}.code{font-family:DejaVu Sans Mono,monospace;font-size:17px;fill:#163c56}.command{font-family:DejaVu Sans Mono,monospace;font-size:19px;fill:#4c3080}.file{font-family:DejaVu Sans Mono,monospace;font-size:16px;fill:#24594c}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.7px;fill:#63758c}.step{font-size:19px;font-weight:700;fill:white}</style>
<rect width="1600" height="2500" fill="#f2f5f9"/>

<text x="64" y="66" class="title">Change a switch once. Regenerate every downstream file.</text>
<text x="64" y="105" class="subtitle">Current keyboard project • the permanent edit belongs in Ergogen source</text>
<rect x="64" y="140" width="1472" height="390" rx="16" fill="#edf5ff" stroke="#b2c9e6"/>
<text x="90" y="175" class="eyebrow">EDIT THIS FILE FIRST</text>
<text x="90" y="210" class="heading">ergogen/config.yaml</text>
<text x="90" y="245" class="body">Existing footprint angles</text>
<text x="90" y="278" class="code">pcbs.braille_placement.footprints:</text>
<text x="90" y="308" class="code">  switches_cw.adjust.rotate: 270</text>
<text x="90" y="338" class="code">  switches_ccw.adjust.rotate: 90</text>
<text x="90" y="390" class="small">Editing either angle changes every switch with that tag.</text>
<text x="90" y="417" class="small">For any other angle, replace one key’s tag with a unique tag</text>
<text x="90" y="444" class="small">and add a matching footprint block with the same switch</text>
<text x="90" y="471" class="small">parameters and your chosen adjust.rotate value.</text>
<text x="850" y="245" class="body">One-switch example: c1 top, 270° → 90°</text>
<text x="850" y="273" class="small">Within points.zones.keys.columns:</text>
<rect x="838" y="292" width="668" height="174" rx="10" fill="#ffffff" stroke="#d0deed"/>
<text x="858" y="320" class="code">c1:</text>
<text x="858" y="348" class="code">  key.tags: [switch, rot_cw]</text>
<text x="858" y="376" class="code">  rows:</text>
<text x="858" y="404" class="code">    top:</text>
<text x="858" y="432" class="code">      tags: [switch, rot_ccw]</text>
<text x="850" y="495" class="small">Verified in memory: only keys_c1_top changes its tag.</text>
<text x="90" y="503" class="small">Each key must match exactly one switch footprint block.</text>
<text x="64" y="570" class="eyebrow">RUN FROM THE PROJECT DIRECTORY</text>
<text x="64" y="599" class="code">/home/logan/Documents/Codex/2026-10-23-new-realtime-voice-chat</text>
<rect x="64" y="632" width="828" height="168" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="668" r="19" fill="#536ca1"/>
<text x="100" y="674" text-anchor="middle" class="step">1</text>
<text x="134" y="676" class="heading">Generate switch footprints</text>
<text x="92" y="718" class="command">npm run build</text>
<text x="92" y="754" class="small">Runs the footprint adapters and Ergogen.</text>
<text x="92" y="779" class="small">Pads and holes now use the chosen rotation.</text>
<path d="M900 716.0 L958 716.0" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="976" y="632" width="560" height="168" rx="16" fill="#eef8f3" stroke="#c3ddce"/>
<text x="1000" y="664" class="eyebrow">GENERATES / REFRESHES</text>
<text x="1000" y="698" class="file">output/pcbs/</text>
<text x="1000" y="725" class="file">  braille_placement.kicad_pcb</text>
<text x="1000" y="752" class="file">output/points/ + output/outlines/</text>
<path d="M478 805 L478 828" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="842" width="828" height="170" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="878" r="19" fill="#536ca1"/>
<text x="100" y="884" text-anchor="middle" class="step">2</text>
<text x="134" y="886" class="heading">Prepare the KiCad source</text>
<text x="92" y="928" class="command">python3 scripts/prepare_kicad.py</text>
<text x="92" y="966" class="small">Refreshes placement data, routing input,</text>
<text x="92" y="991" class="small">and the marked controller/switch clearances.</text>
<path d="M900 927.0 L958 927.0" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="976" y="842" width="560" height="170" rx="16" fill="#eef8f3" stroke="#c3ddce"/>
<text x="1000" y="874" class="eyebrow">GENERATES / REFRESHES</text>
<text x="1000" y="908" class="file">kicad/braille_review_unrouted.kicad_pcb</text>
<text x="1000" y="935" class="file">kicad/braille_review.dsn</text>
<text x="1000" y="962" class="file">kicad/geometry.json + pin-map.csv</text>
<path d="M478 1017 L478 1040" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="1054" width="828" height="185" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="1090" r="19" fill="#536ca1"/>
<text x="100" y="1096" text-anchor="middle" class="step">3</text>
<text x="134" y="1098" class="heading">Route again using the new pad locations</text>
<text x="92" y="1140" class="command">python3 scripts/route_board.py</text>
<text x="92" y="1193" class="small">Runs Freerouting and imports its new copper into KiCad.</text>
<text x="92" y="1218" class="small">A fresh routing pass is required after moving pads.</text>
<path d="M900 1146.5 L958 1146.5" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="976" y="1054" width="560" height="185" rx="16" fill="#eef8f3" stroke="#c3ddce"/>
<text x="1000" y="1086" class="eyebrow">GENERATES / REFRESHES</text>
<text x="1000" y="1120" class="file">kicad/braille_review.ses</text>
<text x="1000" y="1147" class="file">kicad/braille_review_routed.kicad_pcb</text>
<text x="1000" y="1174" class="file">kicad/drc-routed.json + .txt</text>
<path d="M478 1244 L478 1267" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="1281" width="828" height="235" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="1317" r="19" fill="#536ca1"/>
<text x="100" y="1323" text-anchor="middle" class="step">4</text>
<text x="134" y="1325" class="heading">Refresh 3D models, renders and layout</text>
<text x="92" y="1367" class="command">python3 scripts/render_review.py</text>
<text x="92" y="1444" class="small">Rebuilds the assembly meshes, renders them with KiCad,</text>
<text x="92" y="1469" class="small">and refreshes the board-only STEP and 2D layout.</text>
<text x="92" y="1494" class="small">Its 2D refresh replaces the early preview from step 1.</text>
<path d="M900 1398.5 L958 1398.5" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="976" y="1281" width="560" height="235" rx="16" fill="#eef8f3" stroke="#c3ddce"/>
<text x="1000" y="1313" class="eyebrow">GENERATES / REFRESHES</text>
<text x="1000" y="1347" class="file">models/*-envelopes.wrl</text>
<text x="1000" y="1374" class="file">kicad/braille_*_preview.kicad_pcb</text>
<text x="1000" y="1401" class="file">previews/assembly-top.png</text>
<text x="1000" y="1428" class="file">previews/assembly-bottom.png</text>
<text x="1000" y="1455" class="file">previews/modules-bottom.png</text>
<text x="1000" y="1482" class="file">previews/layout-review.svg</text>
<text x="1000" y="1509" class="file">models/routed-board.step</text>
<path d="M478 1521 L478 1544" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="1558" width="828" height="160" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="1594" r="19" fill="#536ca1"/>
<text x="100" y="1600" text-anchor="middle" class="step">5</text>
<text x="134" y="1602" class="heading">Validate the complete regenerated draft</text>
<text x="92" y="1644" class="command">npm run check</text>
<text x="92" y="1672" class="small">Checks source/PCB agreement, nets and dimensions.</text>
<text x="92" y="1697" class="small">Existing DRC findings still require manual review.</text>
<path d="M900 1638.0 L958 1638.0" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="976" y="1558" width="560" height="160" rx="16" fill="#eef8f3" stroke="#c3ddce"/>
<text x="1000" y="1590" class="eyebrow">GENERATES / REFRESHES</text>
<text x="1000" y="1624" class="file">kicad/review-summary.json</text>
<text x="1000" y="1651" class="file">Read the DRC report from step 3.</text>
<path d="M478 1723 L478 1746" fill="none" stroke="#71829a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="64" y="1760" width="1472" height="390" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<circle cx="100" cy="1796" r="19" fill="#536ca1"/>
<text x="100" y="1802" text-anchor="middle" class="step">6</text>
<text x="134" y="1804" class="heading">Publish to the Pi’s existing web server</text>
<text x="92" y="1844" class="small">Run after reviewing the generated outputs:</text>
<text x="92" y="1880" class="code">rsync -a --exclude=__pycache__ --exclude=&#x27;*.log&#x27; \</text>
<text x="92" y="1906" class="code">  ergogen scripts output kicad previews models docs \</text>
<text x="92" y="1932" class="code">  README.md package.json package-lock.json requirements-preview.txt \</text>
<text x="92" y="1958" class="code">  /home/logan/www/braille-keyboard/</text>
<text x="92" y="1984" class="code"></text>
<text x="92" y="2010" class="code">cd /home/logan/www</text>
<text x="92" y="2036" class="code">zip -qr braille-keyboard/braille-keyboard-review.zip \</text>
<text x="92" y="2062" class="code">  braille-keyboard \</text>
<text x="92" y="2088" class="code">  -x &#x27;braille-keyboard/braille-keyboard-review.zip&#x27;</text>
<text x="92" y="2130" class="small">Refresh the browser page to view the updated files and download the rebuilt ZIP.</text>
<rect x="64" y="2180" width="1472" height="248" rx="16" fill="#fff8e9" stroke="#e5d3a6"/>
<text x="90" y="2219" class="heading">What changes — and what the preview can show</text>
<text x="90" y="2254" class="small">• Use footprint adjust.rotate for a switch’s pads and holes. Point rotate also changes the layout frame.</text>
<text x="90" y="2281" class="small">• Current 3D switch bodies are generic square envelopes; their silhouettes do not reveal switch orientation.</text>
<text x="90" y="2308" class="small">  The native PCB holes and pads do update. Detailed switch models would make the orientation visible.</text>
<text x="90" y="2335" class="small">• Generated boards, routing and previews are replaced on rebuild. Save manual KiCad variants separately.</text>
<text x="90" y="2362" class="small">• Commands above use the tools already installed on this Pi. A fresh copy also needs npm ci, KiCad 9</text>
<text x="90" y="2389" class="small">  with pcbnew, Java 25 + Freerouting 2.2.4, and the Python packages in requirements-preview.txt.</text>
<text x="64" y="2470" class="eyebrow">SOURCE → PLACEMENT → COPPER → 3D / DRAWINGS → CHECKS → WEB FILES + ZIP</text>
</svg>