# Editable review draft. Routed output is produced separately in kicad/.
# All values are millimetres. The spacing reference heard as "subtle v1.1"
# is unresolved; these pitches are provisional, not taken from that board.
meta:
  name: Braille keyboard placement study
  engine: 4.2.1
  version: 0.1.0

units:
  # Square nominal U chosen for this study only; not a switch compatibility claim.
  unit_x: 19.05
  unit_y: 19.05
  # Preserve the compact draft and its explicitly accepted shaft/header clashes.
  column_extra: 0
  pitch_x: unit_x + column_extra
  row_step: 1.25 unit_y
  outer_height: 1.5 unit_y
  keyarea_w: 3 pitch_x + unit_x
  keyarea_h: 4 unit_y
  cap_gap: 1
  # These rectangles are NOMINAL envelopes, not a purchased keycap drawing.
  cap_w: unit_x - cap_gap
  cap_mid_h: unit_y - cap_gap
  cap_outer_h: outer_height - cap_gap
  switch_cutout: 13.8
  # The main PCB stays within the outer envelope of the drawn keycaps.
  board_margin: 0
  board_w: 3 pitch_x + cap_w
  board_h: 2 row_step + cap_outer_h
  board_corner: 3
  mount_inset: 3
  mount_diameter: 2.2
  standoff_diameter: 4
  plate_overhang: 0
  acrylic_thickness: 3
  # A placeholder parameter for later stack-up modelling, NOT a validated height.
  standoff_height: 6.5
  controller_socket_height: 3
  display_socket_height: 3.3
  battery_mount_drop: 3.3
  switch_preview_height: 5.3
  keycap_preview_z: 6.5
  keycap_preview_thickness: 2
  battery_w: 12
  battery_h: 30
  battery_t: 3
  battery_margin: 1
  # Passive adhesive accessory ring, outside the acrylic, no charging coil.
  ring_outer_diameter: 56
  ring_inner_diameter: 46
  ring_thickness: 0.4
  # Flush underside screw heads are a provisional mechanical requirement.
  screw_head_projection: 0
  # USB drawing ends at local y=-16.51; put this at the main PCB edge.
  usb_gap: -1.5  # inset USB connector from the north board edge
  mcu_y: 0.5 board_h - 16.51 + usb_gap
  display_y: 0
  battery_y: 0

points:
  zones:
    keys:
      anchor:
        shift: [100, -100 - row_step]
      key:
        spread: pitch_x
        padding: row_step
        width: cap_w
        height: cap_outer_h
        tags: [switch]
      columns:
        c1:
          key.tags: [switch, rot_cw]
        c2:
          key.tags: [switch, rot_ccw]
        c3:
          key.tags: [switch, rot_ccw]
        c4:
          key.tags: [switch, rot_cw]
      rows:
        bottom:
          nominal_height: outer_height
        middle:
          height: cap_mid_h
          nominal_height: unit_y
        top:
          nominal_height: outer_height
    controller:
      anchor:
        shift: [100 + 0.5 pitch_x, -100 + mcu_y]
      key:
        tags: [controller]
    display:
      anchor:
        shift: [100 + 1.5 pitch_x, -100 + display_y]
      key:
        tags: [display]
    battery:
      anchor:
        shift: [100 + 2.5 pitch_x, -100 + battery_y]
      key:
        tags: [battery]
    reset:
      anchor.shift: [100 - 0.5 cap_w + 3.95, -100]
      key.tags: [reset]
    power:
      anchor.shift: [100 + 0.5 pitch_x, -100 - 0.5 board_h + 3.6]
      key.tags: [power]
    jst:
      anchor.shift: [100 + 2.5 pitch_x, -100 - 0.5 board_h + 11.8]
      key.tags: [jst]
    mount_nw:
      anchor:
        shift: [100 - 0.5 cap_w + mount_inset, -100 + 0.5 board_h - mount_inset]
      key.tags: [mount]
    mount_ne:
      anchor:
        shift: [100 + 3 pitch_x + 0.5 cap_w - mount_inset, -100 + 0.5 board_h - mount_inset]
      key.tags: [mount]
    mount_sw:
      anchor:
        shift: [100 - 0.5 cap_w + mount_inset, -100 - 0.5 board_h + mount_inset]
      key.tags: [mount]
    mount_se:
      anchor:
        shift: [100 + 3 pitch_x + 0.5 cap_w - mount_inset, -100 - 0.5 board_h + mount_inset]
      key.tags: [mount]

outlines:
  nominal_keycaps:
    - what: rectangle
      where: /^keys_.*_(top|bottom)$/
      size: [cap_w, cap_outer_h]
      corner: 1.2
    - what: rectangle
      where: /^keys_.*_middle$/
      size: [cap_w, cap_mid_h]
      corner: 1.2
  switch_cutouts:
    - what: rectangle
      where: switch
      size: switch_cutout
  pcb_boundary:
    - what: rectangle
      where:
        shift: [100 + 1.5 pitch_x, -100]
      size: [board_w, board_h]
      corner: board_corner
  mount_holes:
    - what: circle
      where: mount
      radius: 0.5 mount_diameter
  standoff_envelopes:
    - what: circle
      where: mount
      radius: 0.5 standoff_diameter
  baseplate:
    - what: rectangle
      where:
        shift: [100 + 1.5 pitch_x, -100]
      size: [board_w + 2 plate_overhang, board_h + 2 plate_overhang]
      corner: board_corner + plate_overhang
    - name: mount_holes
      operation: subtract
  battery_envelope:
    - what: rectangle
      where: battery
      size: [battery_w, battery_h]
  battery_reservation:
    - what: rectangle
      where: battery
      size: [battery_w + 2 battery_margin, battery_h + 2 battery_margin]

pcbs:
  braille_placement:
    template: kicad8
    references: true
    outlines:
      edge:
        outline: pcb_boundary
      caps:
        outline: nominal_keycaps
        layer: Dwgs.User
      cell:
        outline: battery_envelope
        layer: B.Fab
      battery_keepout_drawing:
        outline: battery_reservation
        layer: Dwgs.User
      supports:
        outline: standoff_envelopes
        layer: Dwgs.User
    footprints:
      # Portrait Choc caps require a 90/270-degree switch orientation.
      # Middle caps use the same orientation provisionally to move side posts
      # away from the battery. Real keycap geometry must be checked later.
      switches_cw:
        what: ceoloide/switch_choc_v1_v2
        where: rot_cw
        adjust.rotate: 270
        params:
          side: F
          reversible: false
          hotswap: false
          solder: true
          choc_v1_support: true
          choc_v2_support: false
          include_stabilizer_pad: false
          include_corner_marks: true
          include_traces_vias: false
          allow_soldermask_bridges: false
          from: "{{colrow}}"
          to: GND
      switches_ccw:
        what: ceoloide/switch_choc_v1_v2
        where: rot_ccw
        adjust.rotate: 90
        params:
          side: F
          reversible: false
          hotswap: false
          solder: true
          choc_v1_support: true
          choc_v2_support: false
          include_stabilizer_pad: false
          include_corner_marks: true
          include_traces_vias: false
          allow_soldermask_bridges: false
          from: "{{colrow}}"
          to: GND
      controller:
        what: local/nice_nano_extended
        where: controller
        params:
          side: B
          reverse_mount: true
          reversible: false
          include_traces: false
          include_extra_pins: false
          show_instructions: false
          RAW: VBAT
          VCC: 3V3
          P1: DISPLAY_CS
          P2: DISPLAY_MOSI
          P3: DISPLAY_SCK
          P4: c1_bottom
          P5: c1_middle
          P6: c1_top
          P7: c2_bottom
          P8: c2_middle
          P9: c2_top
          P10: c3_bottom
          P14: c3_middle
          P15: c3_top
          P16: c4_bottom
          P18: c4_middle
          P19: c4_top
      display:
        what: ceoloide/display_nice_view
        where: display
        params:
          side: B
          reversible: false
          include_traces: false
          include_courtyard: true
          MOSI: DISPLAY_MOSI
          SCK: DISPLAY_SCK
          CS: DISPLAY_CS
          VCC: 3V3
      reset:
        what: ceoloide/reset_switch_smd_side
        where: reset
        adjust.rotate: 90
        params:
          side: B
          include_courtyard: true
          from: GND
          to: RST
      power:
        what: ceoloide/power_switch_smd_side
        where: power
        adjust.rotate: 270
        params:
          side: B
          include_courtyard: true
          from: BAT_P
          to: VBAT
      battery_connector:
        what: ceoloide/battery_connector_jst_ph_2
        where: jst
        params:
          side: B
          reversible: false
          include_traces: false
          BAT_P: BAT_P
          BAT_N: GND
      mounts:
        what: local/mounting_hole_npth
        where: mount
        params:
          side: B
          hole_size: mount_diameter
          hole_drill: mount_diameter
