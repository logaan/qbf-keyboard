# Generated by scripts/build_modules.py; module placement study.
meta:
  name: Braille module 3 placement study
  engine: 4.2.1
  version: 0.1.0
units:
  unit_x: 19.05
  unit_y: 19.05
  column_extra: 0
  pitch_x: unit_x + column_extra
  row_step: 1.25 unit_y
  outer_height: 1.5 unit_y
  keyarea_w: 3 pitch_x + unit_x
  keyarea_h: 4 unit_y
  cap_gap: 1
  cap_w: unit_x - cap_gap
  cap_mid_h: unit_y - cap_gap
  cap_outer_h: outer_height - cap_gap
  switch_cutout: 13.8
  board_margin: 0
  board_w: 3 pitch_x + cap_w
  board_h: 2 row_step + cap_outer_h
  board_corner: 3
  mount_inset: 3
  mount_diameter: 2.2
  standoff_diameter: 4
  plate_overhang: 0
  acrylic_thickness: 3
  standoff_height: 6.5
  controller_socket_height: 3
  display_socket_height: 3.3
  battery_mount_drop: 3.3
  switch_preview_height: 5.3
  keycap_preview_z: 6.5
  keycap_preview_thickness: 2
  battery_w: 50
  battery_h: 50
  battery_t: 3
  battery_margin: 1
  ring_outer_diameter: 56
  ring_inner_diameter: 46
  ring_thickness: 0.4
  screw_head_projection: 0
  usb_gap: -1.5
  mcu_y: 0.5 board_h - 16.51 + usb_gap
  display_y: 0
  battery_y: 0
points:
  zones:
    controller:
      anchor:
        shift:
        - 100 + 0.55 pitch_x
        - -100 + 11
      key:
        tags:
        - controller
    display:
      anchor:
        shift:
        - 100 + 2.5 pitch_x
        - -100 + 11
      key:
        tags:
        - display
    battery:
      anchor:
        shift:
        - 100 + 1.5 pitch_x
        - -100 + 5
      key:
        tags:
        - battery
    reset:
      anchor.shift:
      - 100 + 2.6 pitch_x
      - -100 - 0.5 board_h + 4.8
      key.tags:
      - reset
    power:
      anchor.shift:
      - 100 + 0.4 pitch_x
      - -100 - 0.5 board_h + 3.6
      key.tags:
      - power
    jst:
      anchor.shift:
      - 100 + 1.5 pitch_x
      - -100 + 0.5 board_h - 5
      key.tags:
      - jst
    mount_nw:
      anchor:
        shift:
        - 100 - 0.5 cap_w + mount_inset
        - -100 + 0.5 board_h - mount_inset
      key.tags:
      - mount
    mount_ne:
      anchor:
        shift:
        - 100 + 3 pitch_x + 0.5 cap_w - mount_inset
        - -100 + 0.5 board_h - mount_inset
      key.tags:
      - mount
    mount_sw:
      anchor:
        shift:
        - 100 - 0.5 cap_w + mount_inset
        - -100 - 0.5 board_h + mount_inset
      key.tags:
      - mount
    mount_se:
      anchor:
        shift:
        - 100 + 3 pitch_x + 0.5 cap_w - mount_inset
        - -100 - 0.5 board_h + mount_inset
      key.tags:
      - mount
    key_bottom_1:
      anchor:
        shift:
        - 100 + 0 pitch_x
        - -100 - row_step - 4
      key:
        tags:
        - switch
        - rot_cw
    key_bottom_2:
      anchor:
        shift:
        - 100 + 1 pitch_x
        - -100 - row_step - 4
      key:
        tags:
        - switch
        - rot_ccw
    key_bottom_3:
      anchor:
        shift:
        - 100 + 2 pitch_x
        - -100 - row_step - 4
      key:
        tags:
        - switch
        - rot_ccw
    key_bottom_4:
      anchor:
        shift:
        - 100 + 3 pitch_x
        - -100 - row_step - 4
      key:
        tags:
        - switch
        - rot_cw
    trackpad:
      anchor:
        shift:
        - 100 + 1.5 pitch_x
        - -100 + 9
      key:
        tags:
        - trackpad
outlines:
  nominal_keycaps:
  - what: rectangle
    where: switch
    size:
    - cap_w
    - cap_mid_h
    corner: 1.2
  switch_cutouts:
  - what: rectangle
    where: switch
    size: switch_cutout
  pcb_boundary:
  - what: rectangle
    where:
      shift:
      - 100 + 1.5 pitch_x
      - -100
    size:
    - board_w
    - board_h
    corner: board_corner
  mount_holes:
  - what: circle
    where: mount
    radius: 0.5 mount_diameter
  standoff_envelopes:
  - what: circle
    where: mount
    radius: 0.5 standoff_diameter
  baseplate:
  - what: rectangle
    where:
      shift:
      - 100 + 1.5 pitch_x
      - -100
    size:
    - board_w + 2 plate_overhang
    - board_h + 2 plate_overhang
    corner: board_corner + plate_overhang
  - name: mount_holes
    operation: subtract
  battery_envelope:
  - what: rectangle
    where: battery
    size:
    - battery_w
    - battery_h
  battery_reservation:
  - what: rectangle
    where: battery
    size:
    - battery_w + 2 battery_margin
    - battery_h + 2 battery_margin
  trackpad_envelope:
  - what: rectangle
    where: trackpad
    size:
    - 43
    - 43
    corner: 1
pcbs:
  module3_placement:
    template: kicad8
    references: true
    outlines:
      edge:
        outline: pcb_boundary
      caps:
        outline: nominal_keycaps
        layer: Dwgs.User
      cell:
        outline: battery_envelope
        layer: B.Fab
      battery_keepout_drawing:
        outline: battery_reservation
        layer: Dwgs.User
      supports:
        outline: standoff_envelopes
        layer: Dwgs.User
      touch_surface:
        outline: trackpad_envelope
        layer: Dwgs.User
    footprints:
      switches_cw:
        what: ceoloide/switch_choc_v1_v2
        where: rot_cw
        adjust.rotate: 270
        params:
          side: F
          reversible: false
          hotswap: false
          solder: true
          choc_v1_support: true
          choc_v2_support: false
          include_stabilizer_pad: false
          include_corner_marks: true
          include_traces_vias: false
          allow_soldermask_bridges: false
          from: '{{colrow}}'
          to: GND
      switches_ccw:
        what: ceoloide/switch_choc_v1_v2
        where: rot_ccw
        adjust.rotate: 90
        params:
          side: F
          reversible: false
          hotswap: false
          solder: true
          choc_v1_support: true
          choc_v2_support: false
          include_stabilizer_pad: false
          include_corner_marks: true
          include_traces_vias: false
          allow_soldermask_bridges: false
          from: '{{colrow}}'
          to: GND
      controller:
        what: local/nice_nano_extended
        where: controller
        params:
          side: F
          reverse_mount: true
          reversible: false
          include_traces: false
          include_extra_pins: false
          show_instructions: false
          RAW: VBAT
          VCC: 3V3
          P4: key_bottom_1
          P5: key_bottom_2
          P6: key_bottom_3
          P7: key_bottom_4
          P14: TP_SDA
          P15: TP_SCL
          P16: TP_RDY
          P18: TP_RST
      display:
        what: ceoloide/display_nice_view
        where: display
        params:
          side: F
          reversible: false
          include_traces: false
          include_courtyard: true
          MOSI: DISPLAY_MOSI
          SCK: DISPLAY_SCK
          CS: DISPLAY_CS
          VCC: 3V3
      reset:
        what: ceoloide/reset_switch_smd_side
        where: reset
        adjust.rotate: 90
        params:
          side: F
          include_courtyard: true
          from: GND
          to: RST
      power:
        what: ceoloide/power_switch_smd_side
        where: power
        adjust.rotate: 270
        params:
          side: F
          include_courtyard: true
          from: BAT_P
          to: VBAT
      battery_connector:
        what: ceoloide/battery_connector_jst_ph_2
        where: jst
        params:
          side: B
          reversible: false
          include_traces: false
          BAT_P: BAT_P
          BAT_N: GND
      mounts:
        what: local/mounting_hole_npth
        where: mount
        params:
          side: B
          hole_size: mount_diameter
          hole_drill: mount_diameter
      trackpad_interface:
        what: local/tps43_interface
        where: trackpad
        params:
          side: F
          VCC: 3V3
          GND: GND
          SDA: TP_SDA
          SCL: TP_SCL
          RDY: TP_RDY
          RST: TP_RST
