<text x="665" y="741" font-size="21" fill="#22323b" text-anchor="start">1.23 cap-to-roof gap</text>
<text x="975" y="730" font-size="30" fill="#22323b" text-anchor="start">Tool-free everyday use</text>
<text x="975" y="775" font-size="21" fill="#22323b" text-anchor="start">Join: insert four bridge heads, then slide 6.5 mm.</text>
<text x="975" y="814" font-size="21" fill="#22323b" text-anchor="start">Split: press both underside tabs, slide back, lift off.</text>
<text x="975" y="853" font-size="21" fill="#22323b" text-anchor="start">Cover: press down until the front/back clips catch.</text>
<text x="975" y="892" font-size="21" fill="#22323b" text-anchor="start">Uncover: pull both cover tabs outward and lift.</text>
<text x="975" y="931" font-size="21" fill="#22323b" text-anchor="start">Each half can be used and covered on its own.</text>
<text x="975" y="970" font-size="21" fill="#22323b" text-anchor="start">Separate halves for straight USB cable access.</text>
<text x="90" y="1060" font-size="21" fill="#22323b" text-anchor="start">CAD fit is verified; print fit, clip fatigue, luggage loads and the recessed controller assembly need physical testing.</text>
</svg>
