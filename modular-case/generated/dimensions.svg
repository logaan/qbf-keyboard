<text x="120" y="638" font-size="21" fill="#22323b" text-anchor="start">Joined width: 97.7 + 10 + 97.7 = 205.4</text>
<text x="975" y="195" font-size="30" fill="#22323b" text-anchor="start">Key and wall clearances</text>
<text x="975" y="242" font-size="22" fill="#22323b" text-anchor="start">Main caps: 16.5 × 26.5 (portrait 1.5U)</text>
<text x="975" y="281" font-size="22" fill="#22323b" text-anchor="start">Column 5: 17.5 × 16.5 (1U)</text>
<text x="975" y="320" font-size="22" fill="#22323b" text-anchor="start">PCB beyond cap edges: 2.25</text>
<text x="975" y="359" font-size="22" fill="#22323b" text-anchor="start">Perimeter wall: 2.0 • cap gap: 0.25</text>
<text x="975" y="398" font-size="22" fill="#22323b" text-anchor="start">Four M2 mounts • battery roof clearance: 0.30</text>
<text x="975" y="437" font-size="22" fill="#22323b" text-anchor="start">Controller: 21 × 17.8 • USB faces inward</text>
<text x="975" y="525" font-size="30" fill="#22323b" text-anchor="start">Transport envelope, each half</text>
<text x="975" y="570" font-size="34" fill="#22323b" text-anchor="start">100.9 × 63.3 × 21.2</text>
<text x="975" y="607" font-size="21" fill="#22323b" text-anchor="start">Includes the cover finger tabs and tray feet.</text>
